# Nothing here is new work. It is the same gate the pipeline runs, run again on a
# schedule against whatever the ecosystem looks like that week.
#
# A cartridge header does not change, so a green build today is usually a green
# build next year. What moves underneath it is everything else: a new Python
# release changes integer or annotation behaviour, a linter release adds a rule, a
# checker release finds something the old one did not, a runner image swaps a
# default. Each of those turns a passing project into a failing one without a
# commit, and the difference between hearing about it on a Monday and hearing
# about it from the next person to open a pull request is this file.
#
# It runs on the newest Python available rather than the pinned one, because the
# point is to find out what the next version breaks before it is the only version
# anybody has.
#
# It does not run the census. That needs a library of cartridges, which is
# somebody's disk and is not on a runner. The part of the gate that needs no
# library is the part that runs here.
name: Weekly

on:
  schedule:
    # Early Monday, UTC. Late enough that a release landing over the weekend is
    # already published, early enough to be read before the week starts.
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:snes-mapper-python
    strategy:
      fail-fast: false
      matrix:
        # The oldest version supported and the newest that exists. A break in the
        # first is a regression; a break in the second is a warning about the
        # release everyone is about to be on.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # Unpinned on purpose, which is the whole point of this file and the one
      # place in the project where that is true. Every other workflow pins.
      - name: Install the newest tools
        run: |
          python -m pip install --disable-pip-version-check \
            --upgrade ruff mypy coverage

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: mypy

      - name: Every test module, under coverage
        run: |
          python -m coverage erase
          status=0
          for module in romimage/*.test.py conformance/*.test.py; do
            echo "::group::${module}"
            python -m coverage run -a "${module}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
        shell: bash

      - name: Coverage must still be total
        run: python -m coverage report

      # The gate that needs no cartridges: this package's constants and its
      # checksum rule against the figures Nintendo printed, including the four
      # worked examples for an image that is not a power of two.
      - name: Header fields against the specification
        run: python conformance/hardware.test.py

  # A submodule pins a commit, and a pin goes stale the way any pin does. This
  # reports how far behind each has fallen rather than waiting for somebody to
  # wonder. It never bumps anything: moving a pin changes what this member does
  # until the suite says otherwise, so it is a change somebody makes and tests.
  pins:
    name: How far behind the submodules are
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compare every pin against its upstream head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=0
          git submodule status | while read -r sha path _rest; do
            sha="${sha#[-+]}"
            name="${path##*/}"
            head=$(gh api "repos/${GITHUB_REPOSITORY%%/*}/${name}/commits?per_page=1" --jq '.[0].sha')
            if [ "${sha}" = "${head}" ]; then
              echo "${name}: at head"
              continue
            fi
            count=$(gh api "repos/${GITHUB_REPOSITORY%%/*}/${name}/compare/${sha}...${head}" --jq '.ahead_by')
            echo "::warning title=${name} is behind::${count} commits behind ${head}. Bump it, run the suite, and read what changed before recording any new output."
          done
          exit "${behind}"
        shell: bash
